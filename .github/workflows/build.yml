name: Build Gramophone APK

on:
  workflow_dispatch:  # 允许手动触发
  push:               # 或者当你推送代码时自动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'  # 关键：下载子模块

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create package.properties
        # 这一步是解决构建报错的关键，自动生成配置文件
        run: echo "releaseType=SelfBuilt" > package.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug  # 编译 debug 版本

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gramophone-Debug
          path: app/build/outputs/apk/debug/*.apk
