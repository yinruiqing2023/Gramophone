name: Android CI

on:
  workflow_dispatch:          # 手动触发（保留）
  push:
    branches: [ "main", "beta" ]   # 推送时自动运行
  pull_request:
    branches: [ "main" ]           # PR 时自动运行

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码（包含子模块）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. 设置 JDK 21（解决 audiofxstub 子模块的兼容性问题）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. 创建必需的配置文件
      - name: Set release type
        run: echo "releaseType=SelfBuilt" > package.properties

      # 4. 编译 Debug APK（不需要签名）
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      # 5. 上传 APK 作为 Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gramophone-Debug
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 9
